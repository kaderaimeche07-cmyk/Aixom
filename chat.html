<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
    <title>AXIOM | المحادثة الذكية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --onion-bg: #1c1815;
            --onion-surface: #26211d;
            --onion-accent: #d4a373;
            
            --pom-primary: #e63946;
            --pom-secondary: #9b2226;
            --pom-glow: rgba(230, 57, 70, 0.25);
            
            --text-main: #f8f9fa;
            --text-dim: #adb5bd;
            --border: rgba(255, 255, 255, 0.08);
        }

        body.theme-space {
            --onion-bg: #0b131d;
            --onion-surface: #132235;
            --onion-accent: #48cae4;
            --pom-primary: #4361ee;
            --pom-secondary: #3a0ca3;
            --pom-glow: rgba(67, 97, 238, 0.3);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }

        html, body {
            background-color: var(--onion-bg);
            color: var(--text-main);
            height: 100%;
            height: 100dvh;
            width: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* الرأس العلوي العائم المنظم */
        .chat-floating-header {
            position: fixed;
            top: 12px; left: 15px; right: 15px;
            max-width: 480px; margin: 0 auto;
            background: rgba(38, 33, 29, 0.92);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border);
            border-radius: 22px;
            padding: 10px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 12px 30px rgba(0,0,0,0.55);
            z-index: 1000;
        }

        body.theme-space .chat-floating-header {
            background: rgba(19, 34, 53, 0.92);
        }

        .header-left-group {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .ai-pulse-dot {
            width: 9px; height: 9px;
            background: #2a9d8f;
            border-radius: 50%;
            box-shadow: 0 0 10px #2a9d8f;
            animation: pulseGlow 2s infinite;
            flex-shrink: 0;
        }
        @keyframes pulseGlow {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.2); opacity: 1; box-shadow: 0 0 15px #2a9d8f; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        .header-title-wrap h2 {
            font-size: 0.84rem;
            font-weight: 900;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .header-title-wrap p {
            font-size: 0.65rem;
            color: var(--onion-accent);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 195px;
        }

        .floating-icon-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border);
            width: 36px; height: 36px;
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.2s;
        }
        .floating-icon-btn:hover { background: rgba(255, 255, 255, 0.14); color: var(--onion-accent); }

        /* منطقة الرسائل */
        .chat-messages-area {
            flex: 1;
            width: 100%;
            max-width: 520px;
            margin: 0 auto;
            padding: 88px 18px 105px 18px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 18px;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }

        .message {
            display: flex;
            flex-direction: column;
            max-width: 86%;
            animation: fadeIn 0.25s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        .message.user { align-self: flex-end; }
        .message.ai { align-self: flex-start; }

        .message-text {
            font-size: 0.88rem;
            line-height: 1.65;
            color: var(--text-main);
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .message.user .message-text {
            background: linear-gradient(135deg, var(--pom-primary), var(--pom-secondary));
            padding: 12px 16px;
            border-radius: 20px 20px 4px 20px;
            color: #fff;
            box-shadow: 0 6px 20px var(--pom-glow);
        }

        .message.ai .message-text {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            padding: 12px 16px;
            border-radius: 20px 20px 20px 4px;
            color: var(--text-main);
        }

        .message-footer {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 6px;
            padding: 0 4px;
        }

        .message-time { font-size: 0.62rem; color: var(--text-dim); }

        .speak-audio-btn {
            background: none;
            border: none;
            color: var(--onion-accent);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.65rem;
            padding: 2px 6px;
            border-radius: 8px;
        }

        /* اقتراحات إكمال الموضوع */
        .suggestions-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 8px;
        }
        .suggestion-chip {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: var(--onion-accent);
            font-size: 0.72rem;
            font-weight: 700;
            padding: 6px 12px;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .suggestion-chip:hover {
            background: rgba(212, 163, 115, 0.15);
            border-color: var(--onion-accent);
        }

        /* الشريط السفلي المثبت والمضمون الظهور دائماً */
        .chat-input-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            max-width: 520px;
            margin: 0 auto;
            background: var(--onion-surface);
            border-top: 1px solid var(--border);
            padding: 10px 14px calc(12px + env(safe-area-inset-bottom, 0px)) 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 2000;
            box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.6);
        }

        .chat-input-field {
            flex: 1;
            min-width: 0;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 11px 16px;
            color: var(--text-main);
            font-size: 0.88rem;
            outline: none;
            font-family: 'Cairo', sans-serif;
            resize: none;
            max-height: 110px;
            line-height: 1.4;
        }
        .chat-input-field:focus {
            border-color: var(--onion-accent);
            background: rgba(255, 255, 255, 0.09);
        }

        .action-icon-circle {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border);
            color: var(--onion-accent);
            width: 42px; height: 42px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .action-icon-circle:hover { background: rgba(212, 163, 115, 0.16); }

        .action-icon-circle.recording {
            background: var(--pom-primary);
            color: #fff;
            border-color: var(--pom-primary);
            box-shadow: 0 0 15px var(--pom-primary);
            animation: pulseRec 1.2s infinite;
        }
        @keyframes pulseRec {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        .send-btn {
            background: linear-gradient(135deg, var(--pom-primary), var(--pom-secondary));
            color: #fff;
            border: none;
            width: 44px; height: 44px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            box-shadow: 0 6px 20px var(--pom-glow);
            transition: transform 0.2s;
            flex-shrink: 0;
        }
        .send-btn:active { transform: scale(0.92); }

        /* نافذة تبديل العالم */
        .world-switcher-modal {
            position: fixed;
            inset: 0;
            background: rgba(10, 8, 7, 0.85);
            backdrop-filter: blur(12px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 3000;
            padding: 20px;
            opacity: 0;
            transition: opacity 0.25s ease;
        }
        .world-switcher-modal.show { display: flex; opacity: 1; }

        .switcher-card {
            background: var(--onion-surface);
            border: 1px solid rgba(212, 163, 115, 0.3);
            border-radius: 26px;
            width: 100%;
            max-width: 340px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.9);
            text-align: center;
        }
        .switcher-card h3 { font-size: 1rem; font-weight: 900; color: var(--onion-accent); }
        .world-option-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 14px;
            color: var(--text-main);
            font-weight: 800;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .world-option-btn:hover { background: rgba(212, 163, 115, 0.15); border-color: var(--onion-accent); }
        .close-switcher { background: none; border: none; color: var(--text-dim); font-size: 0.82rem; cursor: pointer; margin-top: 4px; }
    </style>
</head>
<body>

    <header class="chat-floating-header">
        <div class="header-left-group" onclick="openWorldSwitcher()" title="انقر لتغيير العالم">
            <div class="ai-pulse-dot"></div>
            <div class="header-title-wrap">
                <h2 id="worldTitleDisplay">العالم الحر <i data-lucide="chevron-down" style="width:14px; height:14px;"></i></h2>
                <p id="activeDocIndicator">📄 لا توجد وثيقة نشطة</p>
            </div>
        </div>
        <div class="header-actions">
            <button class="floating-icon-btn" onclick="location.href='dashboard.html'" title="الرئيسية">
                <i data-lucide="home" style="width: 18px; height: 18px;"></i>
            </button>
        </div>
    </header>

    <div class="chat-messages-area" id="messagesContainer">
        <div class="message ai">
            <div class="message-text">أهلاً بك يا مهندس في منصة <b>AXIOM</b>. كيف يمكنني مساعدتك اليوم؟</div>
            <div class="message-footer">
                <span class="message-time">الآن</span>
                <button class="speak-audio-btn" onclick="speakText(this)">
                    <i data-lucide="volume-2" style="width: 14px; height: 14px;"></i> استماع
                </button>
            </div>
            <div class="suggestions-row">
                <span class="suggestion-chip" onclick="sendSuggestion(this)">لخّص الوثيقة النشطة</span>
                <span class="suggestion-chip" onclick="sendSuggestion(this)">حلّل الصورة أو المخطط</span>
            </div>
        </div>
    </div>

    <div class="chat-input-bar">
        <button class="action-icon-circle" onclick="location.href='vault.html'" title="خزنة المستندات">
            <i data-lucide="folder-kanban" style="width: 19px; height: 19px;"></i>
        </button>

        <textarea id="chatInput" class="chat-input-field" rows="1" placeholder="اكتب رسالتك هنا لـ AXIOM..."></textarea>

        <button class="action-icon-circle" id="micBtn" onclick="toggleVoiceRecording()" title="التسجيل الصوتي">
            <i data-lucide="mic" style="width: 19px; height: 19px;"></i>
        </button>

        <button class="send-btn" onclick="sendMessage()" title="إرسال">
            <i data-lucide="send" style="width: 18px; height: 18px;"></i>
        </button>
    </div>

    <div class="world-switcher-modal" id="worldSwitcherModal" onclick="closeWorldSwitcher()">
        <div class="switcher-card" onclick="event.stopPropagation()">
            <h3>🌍 اختر العالم المناسب</h3>
            <button class="world-option-btn" onclick="switchWorld('العالم الأكاديمي والدروس')">🎓 العالم الأكاديمي والدروس</button>
            <button class="world-option-btn" onclick="switchWorld('عالم البرمجة والهندسة')">💻 عالم البرمجة والهندسة</button>
            <button class="world-option-btn" onclick="switchWorld('العالم الحر والاستكشاف')">🚀 العالم الحر والاستكشاف</button>
            <button class="close-switcher" onclick="closeWorldSwitcher()">إغلاق</button>
        </div>
    </div>

    <script>
        lucide.createIcons();

        let currentSessionId = null;

        window.addEventListener('load', () => {
            if (localStorage.getItem('axiom_theme') === 'space') {
                document.body.classList.add('theme-space');
            }

            const currentWorld = localStorage.getItem('axiom_current_world');
            if (currentWorld) {
                document.getElementById('worldTitleDisplay').innerHTML = `${escapeHtml(currentWorld)} <i data-lucide="chevron-down" style="width:14px; height:14px;"></i>`;
                lucide.createIcons();
            }

            const activeDoc = localStorage.getItem('axiom_active_doc');
            if (activeDoc) {
                document.getElementById('activeDocIndicator').innerText = `📄 ${activeDoc}`;
            }

            const activeChatId = localStorage.getItem('axiom_active_chat_id');
            if (activeChatId) {
                currentSessionId = Number(activeChatId);
                loadSavedSession(currentSessionId);
                localStorage.removeItem('axiom_active_chat_id');
            }

            const chatInput = document.getElementById('chatInput');
            chatInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });

            // تمدد تلقائي لحقل الكتابة عند تعدد الأسطر
            chatInput.addEventListener('input', function () {
                this.style.height = 'auto';
                this.style.height = Math.min(this.scrollHeight, 110) + 'px';
            });
        });

        function loadSavedSession(sessionId) {
            const history = JSON.parse(localStorage.getItem('axiom_chats_history') || '[]');
            const session = history.find(h => h.id === sessionId);
            if (session && session.messages && session.messages.length > 0) {
                const container = document.getElementById('messagesContainer');
                container.innerHTML = '';
                session.messages.forEach(msg => {
                    appendMessageDOM(msg.role, msg.text, false);
                });
            }
        }

        function saveMessageToHistory(role, text) {
            let history = JSON.parse(localStorage.getItem('axiom_chats_history') || '[]');
            if (!currentSessionId) {
                currentSessionId = Date.now();
                history.unshift({
                    id: currentSessionId,
                    title: text.slice(0, 38) + (text.length > 38 ? '...' : ''),
                    time: 'الآن',
                    messages: []
                });
            }
            const idx = history.findIndex(h => h.id === currentSessionId);
            if (idx !== -1) {
                history[idx].messages = history[idx].messages || [];
                history[idx].messages.push({ role, text });
                history[idx].time = 'الآن';
                localStorage.setItem('axiom_chats_history', JSON.stringify(history));
            }
        }

        function openWorldSwitcher() {
            const modal = document.getElementById('worldSwitcherModal');
            modal.style.display = 'flex';
            setTimeout(() => modal.classList.add('show'), 10);
        }

        function closeWorldSwitcher() {
            const modal = document.getElementById('worldSwitcherModal');
            modal.classList.remove('show');
            setTimeout(() => modal.style.display = 'none', 250);
        }

        function switchWorld(worldName) {
            localStorage.setItem('axiom_current_world', worldName);
            document.getElementById('worldTitleDisplay').innerHTML = `${escapeHtml(worldName)} <i data-lucide="chevron-down" style="width:14px; height:14px;"></i>`;
            lucide.createIcons();
            closeWorldSwitcher();
        }

        function sendSuggestion(chip) {
            sendMessage(chip.innerText);
        }

        function appendMessageDOM(role, text, withSuggestions = true) {
            const container = document.getElementById('messagesContainer');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${role}`;

            if (role === 'user') {
                msgDiv.innerHTML = `
                    <div class="message-text">${escapeHtml(text)}</div>
                    <div class="message-footer"><span class="message-time">الآن</span></div>
                `;
            } else {
                msgDiv.innerHTML = `
                    <div class="message-text">${escapeHtml(text)}</div>
                    <div class="message-footer">
                        <span class="message-time">الآن</span>
                        <button class="speak-audio-btn" onclick="speakText(this)">
                            <i data-lucide="volume-2" style="width: 14px; height: 14px;"></i> استماع
                        </button>
                    </div>
                    ${withSuggestions ? `
                    <div class="suggestions-row">
                        <span class="suggestion-chip" onclick="sendSuggestion(this)">تلخيص النتائج في نقاط</span>
                        <span class="suggestion-chip" onclick="sendSuggestion(this)">أعطني تفاصيل تقنية أكثر</span>
                    </div>` : ''}
                `;
            }

            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
            lucide.createIcons();
            return msgDiv;
        }

        async function sendMessage(customText = null) {
            const input = document.getElementById('chatInput');
            const text = customText || input.value.trim();
            if (!text) return;

            appendMessageDOM('user', text, false);
            saveMessageToHistory('user', text);
            if (!customText) {
                input.value = '';
                input.style.height = 'auto';
            }

            const container = document.getElementById('messagesContainer');
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message ai';
            typingDiv.innerHTML = `<div class="message-text" style="color: var(--onion-accent);">⏳ جاري التحليل عبر محرك AXIOM...</div>`;
            container.appendChild(typingDiv);
            container.scrollTop = container.scrollHeight;

            const activeDoc = localStorage.getItem('axiom_active_doc') || '';
            const docContent = localStorage.getItem('axiom_active_doc_content') || '';
            const imageBase64 = localStorage.getItem('axiom_active_image_base64') || '';
            const currentWorld = localStorage.getItem('axiom_current_world') || 'العالم الحر';
            const isImageDoc = Boolean(imageBase64) || /\.(jpg|jpeg|png|webp|gif)$/i.test(activeDoc);

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        prompt: text,
                        hasImage: isImageDoc,
                        imageBase64: imageBase64,
                        world: currentWorld,
                        activeDoc: activeDoc,
                        docContent: docContent
                    })
                });

                const data = await response.json();
                typingDiv.remove();

                const replyText = data.reply || data.error || "⚠️ تعذر الحصول على رد من المحرك.";
                appendMessageDOM('ai', replyText, true);
                saveMessageToHistory('ai', replyText);
            } catch (err) {
                typingDiv.remove();
                const fallbackMsg = "⚠️ تعذر الاتصال بالخادم (Server). تأكد من تشغيل server.js وأن الإنترنت متصل.";
                appendMessageDOM('ai', fallbackMsg, false);
            }
        }

        let isRecording = false;
        function toggleVoiceRecording() {
            const micBtn = document.getElementById('micBtn');
            const input = document.getElementById('chatInput');

            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert("⚠️ متصفحك لا يدعم التعرف على الصوت مباشرة.");
                return;
            }

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            recognition.lang = 'ar-SA';
            recognition.interimResults = false;

            if (!isRecording) {
                recognition.start();
                isRecording = true;
                micBtn.classList.add('recording');
                input.placeholder = "جاري الاستماع...";

                recognition.onresult = (event) => {
                    const speechToText = event.results[0][0].transcript;
                    input.value = speechToText;
                    stopRecordingState();
                    sendMessage(speechToText);
                };
                recognition.onerror = () => stopRecordingState();
                recognition.onend = () => stopRecordingState();
            } else {
                stopRecordingState();
            }
        }

        function stopRecordingState() {
            isRecording = false;
            const micBtn = document.getElementById('micBtn');
            const input = document.getElementById('chatInput');
            micBtn.classList.remove('recording');
            input.placeholder = "اكتب رسالتك هنا لـ AXIOM...";
        }

        function speakText(btn) {
            const textEl = btn.closest('.message').querySelector('.message-text');
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(textEl.innerText);
                utterance.lang = 'ar-SA';
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        function escapeHtml(str) {
            return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
