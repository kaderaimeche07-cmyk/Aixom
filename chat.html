<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AXIOM | المحادثة الذكية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --onion-bg: #1c1815;
            --onion-surface: #26211d;
            --onion-accent: #d4a373;
            --pom-primary: #e63946;
            --pom-secondary: #9b2226;
            --pom-glow: rgba(230, 57, 70, 0.25);
            --text-main: #f8f9fa;
            --text-dim: #adb5bd;
            --border: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }

        body {
            background-color: var(--onion-bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding-bottom: 90px; /* مساحة للشريط السفلي */
        }

        /* رأس صفحة المحادثة */
        .chat-header {
            background: var(--onion-surface);
            border-bottom: 1px solid var(--border);
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .back-btn {
            background: none;
            border: none;
            color: var(--text-main);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.9rem;
        }

        .chat-title h2 {
            font-size: 1rem;
            font-weight: 900;
            color: var(--onion-accent);
            text-align: center;
        }

        .chat-title p {
            font-size: 0.7rem;
            color: var(--text-dim);
            text-align: center;
        }

        /* صندوق الرسائل */
        .chat-messages {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 0.85rem;
            line-height: 1.5;
        }

        .message.ai {
            background: var(--onion-surface);
            border: 1px solid var(--border);
            align-self: flex-start;
            border-top-right-radius: 4px;
        }

        .message.user {
            background: linear-gradient(135deg, var(--pom-primary), var(--pom-secondary));
            color: white;
            align-self: flex-end;
            border-top-left-radius: 4px;
        }

        /* شريط الكتابة والإرسال الثابت في الأسفل */
        .chat-input-container {
            position: fixed;
            bottom: 80px;
            left: 15px;
            right: 15px;
            max-width: 500px;
            margin: 0 auto;
            background: var(--onion-surface);
            border: 1px solid rgba(230, 57, 70, 0.3);
            border-radius: 24px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 1000;
        }

        .chat-input {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 0.9rem;
            padding: 8px;
            outline: none;
        }

        .chat-input::placeholder {
            color: var(--text-dim);
        }

        .send-btn {
            background: linear-gradient(135deg, var(--pom-primary), var(--pom-secondary));
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 15px var(--pom-glow);
            transition: transform 0.2s;
        }

        .send-btn:active {
            transform: scale(0.92);
        }

        /* الشريط السفلي العائم المتكامل */
        .floating-navbar {
            position: fixed;
            bottom: 15px;
            left: 15px;
            right: 15px;
            max-width: 440px;
            margin: 0 auto;
            background: rgba(38, 33, 29, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 26px;
            padding: 10px 15px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            z-index: 2000;
        }

        .nav-link {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            color: var(--text-dim);
            font-size: 0.68rem;
            cursor: pointer;
            background: none;
            border: none;
            transition: color 0.2s;
        }
        .nav-link.active {
            color: var(--onion-accent);
            font-weight: 700;
        }
        .nav-link i { width: 20px; height: 20px; }

        .nav-link.chat-central {
            background: linear-gradient(135deg, var(--pom-primary), var(--pom-secondary));
            color: white;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 20px var(--pom-glow);
            margin-top: -15px;
            border: 3px solid var(--onion-bg);
            cursor: pointer;
        }
        .nav-link.chat-central i { width: 24px; height: 24px; }
    </style>
</head>
<body>

    <!-- رأس المحادثة -->
    <header class="chat-header">
        <button class="back-btn" onclick="window.location.href='dashboard.html'">
            <i data-lucide="arrow-right"></i> عودة
        </button>
        <div class="chat-title">
            <h2 id="activeWorldTitle">العالم الذكي</h2>
            <p>مدعوم بمحركات AXIOM المزدوجة</p>
        </div>
        <div style="width: 50px;"></div>
    </header>

    <!-- منطقة المحادثة والرسائل -->
    <div class="chat-messages" id="chatMessages">
        <div class="message ai">
            أهلاً بك يا مهندس في AXIOM. أنا هنا لمساعدتك في التحليل، الأكواد، وإدارة وثائقك. كيف يمكنني إفادتك اليوم؟
        </div>
    </div>

    <!-- شريط الكتابة والإرسال العائم -->
    <div class="chat-input-container">
        <input type="text" id="userInput" class="chat-input" placeholder="اكتب سؤالك أو أمرك هنا...">
        <button class="send-btn" onclick="sendMessage()">
            <i data-lucide="send" style="width: 18px; height: 18px;"></i>
        </button>
    </div>

    <!-- الشريط السفلي الثابت -->
    <nav class="floating-navbar">
        <button class="nav-link" onclick="window.location.href='dashboard.html'">
            <i data-lucide="home"></i>
            <span>الرئيسية</span>
        </button>
        <button class="nav-link" onclick="window.location.href='dashboard.html'">
            <i data-lucide="compass"></i>
            <span>العوالم</span>
        </button>
        <button class="nav-link chat-central active" onclick="window.location.href='chat.html'">
            <i data-lucide="message-square"></i>
        </button>
        <button class="nav-link" onclick="window.location.href='vault.html'">
            <i data-lucide="folder-kanban"></i>
            <span>الخزنة</span>
        </button>
        <button class="nav-link" onclick="window.location.href='settings.html'">
            <i data-lucide="user"></i>
            <span>حسابي</span>
        </button>
    </nav>

    <script>
        lucide.createIcons();

        // عرض اسم العالم المحدد إن وُجد
        window.addEventListener('load', () => {
            const currentWorld = localStorage.getItem('axiom_current_world');
            if(currentWorld) {
                document.getElementById('activeWorldTitle').innerText = currentWorld;
            }
        });

        // دالة إرسال الرسالة ومعالجتها
        function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if(!text) return;

            const messagesContainer = document.getElementById('chatMessages');

            // إضافة رسالة المستخدم
            const userMsg = document.createElement('div');
            userMsg.className = 'message user';
            userMsg.innerText = text;
            messagesContainer.appendChild(userMsg);

            input.value = '';
            messagesContainer.scrollTop = messagesContainer.scrollHeight;

            // محاكاة رد الذكاء الاصطناعي (سيتم ربطه بـ server.js لاحقاً)
            setTimeout(() => {
                const aiMsg = document.createElement('div');
                aiMsg.className = 'message ai';
                aiMsg.innerText = `تم استلام طلبك وتوجيهه لمحركات AXIOM الذكية بنجاح. جاري المعالجة...`;
                messagesContainer.appendChild(aiMsg);
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }, 1000);
        }

        // إرسال عبر زر Enter لوحة المفاتيح
        document.getElementById('userInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
